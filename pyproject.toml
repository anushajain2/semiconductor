[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcid"
version = "0.2.0"
description = "Thermal composite inverse design: simulation-verified BN-epoxy microstructure design study (Phase 1: 2D verified solver and constrained search)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-fem>=9.0",
  "gmsh>=4.11",
  "shapely>=2.0",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "pyarrow>=14",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tcid = "tcid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
